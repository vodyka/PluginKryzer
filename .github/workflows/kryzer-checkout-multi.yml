name: Build Kryzer Checkout Multi

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/kryzer-checkout-multi/**"
      - ".github/workflows/kryzer-checkout-multi.yml"

jobs:
  windows:
    name: Windows Multi EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/kryzer-checkout-multi/src-tauri

      - name: Build Kryzer Checkout Multi
        shell: pwsh
        run: cargo build --release --manifest-path desktop/kryzer-checkout-multi/src-tauri/Cargo.toml

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item desktop/kryzer-checkout-multi/src-tauri/target/release/kryzer-checkout-multi.exe artifact/Kryzer-Checkout-Multi.exe

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Kryzer-Checkout-Multi-Windows
          path: artifact/Kryzer-Checkout-Multi.exe
          if-no-files-found: error
